name: Build screensaver

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build EyeOfCreation.saver
        run: |
          chmod +x screensaver/build.sh
          ./screensaver/build.sh

      - name: Zip
        run: |
          cd screensaver/build
          ditto -c -k --sequesterRsrc --keepParent EyeOfCreation.saver EyeOfCreation.saver.zip

      - uses: actions/upload-artifact@v4
        with:
          name: EyeOfCreation.saver
          path: screensaver/build/EyeOfCreation.saver.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: screensaver/build/EyeOfCreation.saver.zip
